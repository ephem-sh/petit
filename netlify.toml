[build]
  base = ".netlify-skip/"
  command = "cd .. && npx @ephem-sh/petit@latest build && echo '=== .petit contents ===' && ls -la .petit/.netlify/v1/functions/ && echo '=== copying ===' && find .petit/.netlify -type f"
  publish = "dist/client/"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
