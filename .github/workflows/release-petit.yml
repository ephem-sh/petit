name: Release Petit
on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        # Pass commit messages through the environment, never inlined into the
        # script. Message bodies contain apostrophes and parentheses (e.g.
        # "feat(seo):", "page's") that break a quoted shell literal and caused
        # a syntax error in the previous version.
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            VERSION=$(node -e "console.log(require('./packages/petit/package.json').version)")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(printf '%s' "$COMMIT_MESSAGES" \
            | grep -oE 'release\(petit\): v[0-9]+\.[0-9]+\.[0-9]+' \
            | tail -1 \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [[ -n "$VERSION" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - run: bun run build
      - run: npm install -g npm@latest
      - run: cd packages/petit && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Extract release notes from CHANGELOG
        run: |
          # Print the first version section of the package changelog (between
          # the first "## [x.y.z]" heading and the next "## " heading).
          awk '
            /^## \[[0-9]/ { if (seen) exit; seen=1; print; next }
            seen && /^## / { exit }
            seen { print }
          ' packages/petit/CHANGELOG.md > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          body_path: RELEASE_NOTES.md
