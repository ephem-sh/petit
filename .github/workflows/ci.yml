name: CI
on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx turbo typecheck --filter=@ephem-sh/petit --filter=@workspace/ui
      - run: bunx turbo build --filter=@ephem-sh/petit --filter=@workspace/ui
